name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install Sourcery
        run: pip install sourcery-cli
      - name: Install dependencies
        run: npm ci
      - name: Run Sourcery Check
        run: sourcery review .
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test
        continue-on-error: true
      - name: Verify Report Generation
        if: always()
        run: |
          ls -la playwright-report || echo "Report directory not found"
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "See detailed results in the GitHub Actions tab" >> $GITHUB_STEP_SUMMARY
          if [ -f "playwright-report/test-results.json" ]; then
            cat playwright-report/test-results.json | jq -r '.stats | "✅ Passed: \(.passed)\n❌ Failed: \(.failed)\n⏭️ Skipped: \(.skipped)"' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
