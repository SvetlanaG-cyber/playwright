name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install Sourcery
        run: pip install sourcery-cli
      - name: Install dependencies
        run: npm ci
      - name: Run Sourcery Check
        run: sourcery review .
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test
        continue-on-error: true
      - name: Process Test Results
        if: always()
        run: |
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          
          # Extract test statistics
          TOTAL=$(jq -r '.stats.total // 0' test-results.json)
          PASSED=$(jq -r '.stats.passed // 0' test-results.json)
          FAILED=$(jq -r '.stats.failed // 0' test-results.json)
          FLAKY=$(jq -r '.stats.flaky // 0' test-results.json)
          SKIPPED=$(jq -r '.stats.skipped // 0' test-results.json)
          DURATION=$(jq -r '.stats.duration // 0' test-results.json)

          # Safer duration calculation with error handling
          if [ -n "$DURATION" ] && [ "$DURATION" != "null" ]; then
            TOTAL_SECONDS=$(echo "scale=0; $DURATION / 1000" | bc || echo "0")
            MINUTES=$(echo "$TOTAL_SECONDS / 60" | bc || echo "0")
            REMAINING_SECONDS=$(echo "$TOTAL_SECONDS % 60" | bc || echo "0")
            DURATION_TEXT="${MINUTES}m ${REMAINING_SECONDS}s"
          else
            DURATION_TEXT="unknown"
          fi

          # Output results
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ passed: $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "❌ failed: $FAILED" >> $GITHUB_STEP_SUMMARY
          echo "🔄 flaky: $FLAKY" >> $GITHUB_STEP_SUMMARY
          echo "⏭️ skipped: $SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ duration: $DURATION_TEXT" >> $GITHUB_STEP_SUMMARY
          
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "Total suites: $(jq '.suites | length' test-results.json)" >> $GITHUB_STEP_SUMMARY
      - name: Verify Report Generation
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results.json" ]; then
            jq -r '.suites[] | select(.suites != null) | .suites[] | "### " + .title + "\n✅ Passed: " + (.specs | map(select(.ok)) | length | tostring) + "\n❌ Failed: " + (.specs | map(select(.ok | not)) | length | tostring)' test-results.json >> $GITHUB_STEP_SUMMARY
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
