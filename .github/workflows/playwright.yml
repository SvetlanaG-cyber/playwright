name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install Sourcery
        run: pip install sourcery-cli
      - name: Install dependencies
        run: npm ci
      - name: Run Sourcery Check
        run: sourcery review .
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test
        continue-on-error: true
      - name: Process Test Results
        if: always()
        shell: bash
        run: |
          if [ ! -f "test-results.json" ]; then
            echo "::warning::test-results.json not found"
            exit 0
          fi

          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY

          # Function to safely extract JSON values with fallback
          get_stat() {
            jq -r --arg key "$1" '.stats[$key] // 0' test-results.json 2>/dev/null || echo "0"
          }

          # Safely extract statistics with error handling
          {
            TOTAL=$(get_stat "total")
            PASSED=$(get_stat "passed")
            FAILED=$(get_stat "failed")
            FLAKY=$(get_stat "flaky")
            SKIPPED=$(get_stat "skipped")
            DURATION=$(get_stat "duration")
          } 2>/dev/null || {
            echo "::error::Failed to extract test statistics"
            exit 1
          }

          # Calculate duration with safe arithmetic
          DURATION_TEXT="0m 0s"
          if [ "$DURATION" -gt 0 ] 2>/dev/null; then
            TOTAL_SECONDS=$((DURATION / 1000))
            MINUTES=$((TOTAL_SECONDS / 60))
            SECONDS=$((TOTAL_SECONDS % 60))
            DURATION_TEXT="${MINUTES}m ${SECONDS}s"
          fi

          # Output results in a single block
          {
            echo "### Summary"
            echo "✅ Passed: $PASSED"
            echo "❌ Failed: $FAILED"
            echo "🔄 Flaky: $FLAKY"
            echo "⏭️ Skipped: $SKIPPED"
            echo "⏱️ Duration: $DURATION_TEXT"
            echo
            echo "### Details"
            echo "Total suites: $(jq '.suites | length // 0' test-results.json)"
          } >> $GITHUB_STEP_SUMMARY
      - name: Verify Report Generation
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results.json" ]; then
            jq -r '.suites[] | select(.suites != null) | .suites[] | "### " + .title + "\n✅ Passed: " + (.specs | map(select(.ok)) | length | tostring) + "\n❌ Failed: " + (.specs | map(select(.ok | not)) | length | tostring)' test-results.json >> $GITHUB_STEP_SUMMARY
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
