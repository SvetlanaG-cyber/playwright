name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install Sourcery
        run: pip install sourcery-cli
      - name: Install dependencies
        run: npm ci
      - name: Run Sourcery Check
        run: sourcery review .
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          CI: true
        run: |
          mkdir -p test-results
          npx playwright test --reporter=list,json --output test-results/
        continue-on-error: true
      - name: Process Test Results
        if: always()
        shell: bash
        run: |
          RESULTS_FILE="test-results/report.json"
          if [ ! -f "$RESULTS_FILE" ]; then
            echo "::warning::Test results file not found at $RESULTS_FILE"
            exit 0
          fi

          cp "$RESULTS_FILE" ./test-results.json
      - name: Verify Report Generation
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results.json" ]; then
            jq -r '.suites[] | select(.suites != null) | .suites[] | "### " + .title + "\n✅ Passed: " + (.specs | map(select(.ok)) | length | tostring) + "\n❌ Failed: " + (.specs | map(select(.ok | not)) | length | tostring)' test-results.json >> $GITHUB_STEP_SUMMARY || echo "::warning::Failed to process test results"
          else
            echo "No test results available" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
